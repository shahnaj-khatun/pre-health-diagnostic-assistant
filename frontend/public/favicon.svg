<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="indigoViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- Indigo 600 -->
      <stop offset="100%" stop-color="#8b5cf6" /> <!-- Violet 500 -->
    </linearGradient>
    <linearGradient id="lightGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#indigoViolet)" filter="url(#shadow)" />
  
  <!-- Outer Ring (AI Node/Network feel) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="white" stroke-width="12" stroke-opacity="0.2" stroke-dasharray="20 15" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="white" stroke-width="4" stroke-opacity="0.1" />

  <!-- Heart/Shield Hybrid Base -->
  <path d="M256,400 C256,400 120,310 120,180 C120,110 180,90 220,110 C240,120 256,150 256,150 C256,150 272,120 292,110 C332,90 392,110 392,180 C392,310 256,400 256,400 Z" fill="white" stroke="none" />
  
  <!-- Inner Cross / Plus (Medical) & AI Core -->
  <path d="M256,180 L256,290 M200,235 L312,235" stroke="url(#indigoViolet)" stroke-width="32" stroke-linecap="round" />
  
  <!-- AI Core Dot -->
  <circle cx="256" cy="235" r="24" fill="url(#lightGlow)" />
  <circle cx="256" cy="235" r="10" fill="white" />
  
  <!-- Network Nodes -->
  <circle cx="256" cy="180" r="12" fill="#4f46e5" />
  <circle cx="256" cy="290" r="12" fill="#4f46e5" />
  <circle cx="200" cy="235" r="12" fill="#4f46e5" />
  <circle cx="312" cy="235" r="12" fill="#4f46e5" />
</svg>